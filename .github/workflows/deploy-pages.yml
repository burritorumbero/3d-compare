name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # kernel/rust-toolchain.toml pins Rust and the wasm target; rustup installs them here.
      - run: rustup show active-toolchain || rustup toolchain install
        working-directory: kernel
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
      # Must match the wasm-bindgen version in kernel/Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: npm ci
      - run: npm run verify:domain
      - run: npm run verify:models
      - run: npm run verify:kernel
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:budgets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
