[package]
name = "parametric-kernel"
version = "0.1.0"
edition = "2021"
description = "Deformation and measurement solver for 3D Compare's rigged models"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Must match the wasm-bindgen-cli version scripts/build-kernel.mjs expects.
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
